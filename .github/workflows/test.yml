name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 纯引擎测试不依赖 DSH 安装（engine.ts/achievements.ts 零 @deepseek-ai 依赖）。
      # typecheck/build 需要本机 DSH 的私有 @deepseek-ai/* 类型，CI 无法提供 → 不跑。
      - name: Run engine unit tests
        run: node --test tests/engine.test.ts
